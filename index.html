<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Austin Anderson | Architecture Portfolio</title>
<meta name="description" content="M.Arch student at North Dakota State University. Selected architecture work, leadership, research and media.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://austinandersondesign.github.io/">
<meta property="og:title" content="Austin Anderson | Architecture Portfolio">
<meta property="og:description" content="M.Arch student at North Dakota State University. Selected work, leadership and research.">
<meta property="og:image" content="https://austinandersondesign.github.io/photos/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#252E28">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=Baskervville:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: one long, image-led page (work, research, media, about, contact) with project and research detail views and a private editor. */
:root{
  --paper:#F2F3F1; --panel:#FFFFFF; --ink:#15191E; --ink-2:#5F6670; --rule:#D3D7D9; --teal:#1E6B66; --on-teal:#FFFFFF; --wash:#E3E8E6;
  --deep:#123A37; --band-ink:#EAF3F1; --band-2:#A9C9C4; --band-rule:#2C5652; --glow:#7FD6CB;
  /* Matches the print portfolio: Neue Haas Grotesk headings (web stand-in: Inter Tight) and Baskerville body text (web stand-in: Baskervville). */
  --font:"Inter Tight","Neue Haas Grotesk Display Pro","Helvetica Neue",Arial,sans-serif;
  --serif:"Baskervville","Baskerville Display PT",Baskerville,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#181C21;--panel:#20252C;--ink:#ECEEEF;--ink-2:#9AA2AB;--rule:#323942;--teal:#6CC3B9;--on-teal:#0B2523;--wash:#262D35;--deep:#10302E;--band-ink:#E6F1EF;--band-2:#9FC2BD;--band-rule:#2A4F4B;--glow:#7FD6CB;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#181C21;--panel:#20252C;--ink:#ECEEEF;--ink-2:#9AA2AB;--rule:#323942;--teal:#6CC3B9;--on-teal:#0B2523;--wash:#262D35;--deep:#10302E;--band-ink:#E6F1EF;--band-2:#9FC2BD;--band-rule:#2A4F4B;--glow:#7FD6CB;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wide{font-stretch:125%}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.mark{font-weight:700;font-stretch:125%;letter-spacing:.01em;text-decoration:none;font-size:16px;background:none;border:0;padding:0;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap}
.nav button{background:none;border:0;padding:8px 10px;border-radius:8px;font-size:15px;color:var(--ink-2)}
.nav button:hover{color:var(--ink);background:var(--wash)}
@media (max-width:640px){.nav button.opt{display:none}.nav button{padding:8px 7px;font-size:14.5px}.bar .wrap{gap:10px}}

/* hero */
.hero{padding-block:56px 28px}
.hello{font-size:18px;color:var(--teal);font-weight:600;margin:0 0 6px}
.name{font-weight:800;font-stretch:125%;font-size:clamp(46px,10vw,124px);line-height:.92;letter-spacing:-.02em;margin:0;text-wrap:balance}
.intro{max-width:56ch;font-size:clamp(17px,2vw,20px);color:var(--ink-2);margin:22px 0 0}
.intro b{color:var(--ink);font-weight:600}
/* Quick facts: no boxes, just a hairline above and quiet labels. */
.block{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 24px;border-top:1px solid var(--rule);padding-top:12px;margin-top:34px}
.block div{min-width:0}
.block:has(div:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
.block:has(div:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
.block small{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.block span{display:block;font-weight:500;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
@media (max-width:720px){.block{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scale{margin-top:22px;color:var(--ink-2);font-size:11.5px}
.scale .bars{width:220px;max-width:60%}
.scale .nums{display:flex;justify-content:space-between;margin-top:3px;font-variant-numeric:tabular-nums}
.scale .nums span:last-child{margin-right:-14px}
.scale i{display:flex;height:8px;border:1.5px solid var(--ink)}
.scale i b{flex:1;border-right:1.5px solid var(--ink)}
.scale i b:nth-child(odd){background:var(--ink)}
.scale i b:last-child{border-right:0}

/* now showing marquee */
.hero{position:relative}
/* The marquee follows the end of the intro line and never runs past the end of the name; if both don't fit, it stacks below the intro, left aligned. */
.heroid{display:inline-grid;max-width:100%}
.introrow{width:0;min-width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:12px 22px;margin-top:14px}
.introrow .intro{margin:0}
@media (min-width:700px){.name{white-space:nowrap}}
@media (max-width:699px){.introrow{margin-top:14px}.introrow .marquee{width:100%}}
.marquee{position:relative;display:inline-flex;align-items:baseline;gap:10px;text-align:left;background:color-mix(in srgb, var(--deep) 28%, #63676B);color:#FFFFFF;border:0;border-radius:6px;padding:10px 18px 10px;max-width:100%;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.marquee small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--glow);text-transform:uppercase}
.marquee b{font-weight:800;font-stretch:125%;font-size:15px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;min-width:0}
.marquee i{font-style:normal;font-size:12.5px;color:rgba(255,255,255,.8)}
.marquee:hover{transform:translateY(-1px)}
.bulbs{position:absolute;inset:4px;border-radius:4px;pointer-events:none;border:3px dotted var(--glow);opacity:.8}
@media (prefers-reduced-motion:no-preference){.bulbs{animation:twinkle 1.6s ease-in-out infinite}@keyframes twinkle{50%{opacity:1;filter:drop-shadow(0 0 3px var(--glow))}}}

/* theater: plain and quiet so the video leads */
.theater{position:fixed;inset:0;z-index:90;background:color-mix(in srgb, var(--deep) 30%, #0A0B0C);color:#F2F2F0;overflow-y:auto;opacity:0;transition:opacity .3s ease;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.theater.on{opacity:1}
.tclose{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:3;background:transparent;color:#F2F2F0;border:1px solid rgba(255,255,255,.28);border-radius:999px;min-height:40px;padding:0 16px;font-weight:600}
.tclose:hover{border-color:var(--glow)}
.tstage{position:relative;z-index:1;max-width:960px;margin:52px auto 0}
.thead{margin:0 0 14px}
.thead small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--glow)}
.thead h2{margin:2px 0 0;font-weight:700;font-size:clamp(20px,3.2vw,30px);line-height:1.12;color:#FFFFFF}
.thead p{margin:4px 0 0;color:rgba(255,255,255,.62);font-size:14px}
.screen{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border-radius:6px;overflow:hidden}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:20px;background:#000}
.poster p{margin:0;color:rgba(255,255,255,.7);font-size:14.5px}
.bigplay{width:64px;height:64px;border-radius:50%;border:2px solid var(--glow);color:var(--glow);display:grid;place-items:center;font-size:22px}
.vid{background:none;border:0;padding:0;cursor:pointer;font:inherit}
@media (max-width:340px){.marquee i{display:none}}

/* highlights slideshow */
.hl{position:relative;margin-top:30px;aspect-ratio:21/8;max-height:440px;width:100%;max-width:100%;overflow:hidden;background:var(--wash)}
@media (max-width:700px){.hl{aspect-ratio:4/3.4}}
.hl .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.3s ease,visibility 0s 1.3s}
.hl .slide.on{opacity:1;visibility:visible;transition:opacity 1.3s ease}
.hl .slide .ph{position:absolute;inset:0;height:100%}
@media (prefers-reduced-motion:no-preference){.hl .slide.on .ph{animation:drift 7s ease-out both}@keyframes drift{from{transform:scale(1.05)}to{transform:scale(1)}}}
/* Slide caption: same quiet style as the facts strip (hairline + small labels), on a soft shade so it reads over any photo. */
.hl .over{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:end;gap:8px 28px;padding:56px 22px 20px;color:#FFFFFF;background:linear-gradient(to top,rgba(8,10,12,.66),rgba(8,10,12,.28) 60%,rgba(8,10,12,0))}
.hl .over::before{content:'';grid-column:1/-1;border-top:1px solid rgba(255,255,255,.45)}
.hl .over div{min-width:0}
.hl .over small{display:block;font-size:12px;color:rgba(255,255,255,.78);letter-spacing:.02em}
.hl .over b{display:block;font-weight:500;font-size:16px;overflow-wrap:anywhere}
.hl .over button{grid-column:4;justify-self:end;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);border-radius:999px;color:#FFFFFF;font-weight:600;font-size:14px;padding:8px 16px;white-space:nowrap}
.hl .over button:hover{background:rgba(255,255,255,.26)}
@media (max-width:520px){.hl .over{grid-template-columns:minmax(0,1fr);align-items:start;padding:48px 16px 16px;gap:8px}.hl .over button{grid-column:1;justify-self:start;margin-top:4px}}
.hl .ctl{position:absolute;right:16px;top:16px;z-index:3;display:flex;align-items:center;gap:6px}
.hl .ctl button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:var(--panel);display:grid;place-items:center;font-size:15px;padding:0}
.hl .ctl span{font-size:12.5px;font-weight:600;background:var(--panel);border:1.5px solid var(--ink);border-radius:999px;padding:7px 11px;font-variant-numeric:tabular-nums}
.hl .bar2{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:4;background:transparent}
.hl .bar2 i{display:block;height:100%;width:0;background:var(--teal)}
@media (prefers-reduced-motion:no-preference){.hl.playing .bar2 i{animation:fill var(--dur) linear forwards}@keyframes fill{to{width:100%}}}

/* beyond the studio band */
.band{background:var(--deep);color:var(--band-ink);margin-top:clamp(36px,6vw,72px);padding-block:64px 56px;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--band-rule) 1px,transparent 1px),linear-gradient(90deg,var(--band-rule) 1px,transparent 1px);background-size:56px 56px;opacity:.35;pointer-events:none}
.band .wrap{position:relative}
.band .kicker{color:var(--glow);font-weight:600;margin:0 0 8px}
.band h2{font-weight:800;font-stretch:125%;font-size:clamp(32px,5.2vw,60px);line-height:1;margin:0;letter-spacing:-.02em;max-width:18ch;text-wrap:balance}
.band .lead{color:var(--band-2);max-width:58ch;font-size:18px;margin:16px 0 0}
.lead-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:38px;border-top:1.5px solid var(--band-ink)}
.lead-grid article{padding:18px 18px 4px 0;border-right:1px solid var(--band-rule);padding-left:18px;min-width:0}
.lead-grid article:first-child{padding-left:0}
.lead-grid article:last-child{border-right:0}
.lead-grid .fig{font-weight:800;font-stretch:125%;font-size:clamp(30px,4vw,46px);line-height:1;color:var(--glow);overflow-wrap:normal;word-break:normal;hyphens:none}
.lead-grid .fig.long{font-size:clamp(22px,2.5vw,30px);line-height:1.08;padding-top:4px}
.hl .tag,.hl .cap{display:none}
.lead-grid .lab{font-weight:600;margin-top:6px}
.lead-grid .role{font-size:14px;color:var(--band-2);margin-top:10px}
.lead-grid p{font-size:14.5px;color:var(--band-2);margin:4px 0 0}
@media (max-width:900px){.lead-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.lead-grid article:nth-child(2){border-right:0}.lead-grid article:nth-child(3){padding-left:0}.lead-grid article:nth-child(n+3){border-top:1px solid var(--band-rule)}}
@media (max-width:520px){.lead-grid{grid-template-columns:minmax(0,1fr)!important}.lead-grid article{border-right:0!important;padding-left:0!important;border-top:1px solid var(--band-rule)}.lead-grid article:first-child{border-top:0}}
.lead-grid{grid-template-columns:1.35fr repeat(3,minmax(0,1fr))}
.lead-grid .lead-first .fig.long{font-size:clamp(28px,3.4vw,42px)}
.also{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;align-items:center}
.also-lab{color:var(--band-2);font-size:14px;margin-right:4px}
.chip2{font-size:13.5px;border:1px solid var(--band-rule);border-radius:999px;padding:3px 11px;color:var(--band-ink)}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:58px}
.mhead h3{font-weight:700;font-stretch:118%;font-size:clamp(22px,3vw,30px);margin:0}
.mhead .arrows{display:flex;gap:8px}
.mhead .arrows button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--band-ink);background:none;color:var(--band-ink);font-size:16px;padding:0}
.mhead .arrows button:hover{background:var(--band-ink);color:var(--deep)}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:18px;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--band-rule) transparent}
.track .mi{flex:0 0 clamp(260px,32%,360px);scroll-snap-align:start;background:var(--panel);color:var(--ink);border:0}
.track .mi.first{flex-basis:clamp(280px,48%,560px)}
.track .mi .ph{aspect-ratio:16/10}
.track .mi.first .ph{aspect-ratio:16/9}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:56px;height:56px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* placeholders standing in for real photos */
.ph{position:relative;width:100%;max-width:100%;overflow:hidden;background-color:hsl(var(--h) 22% 46% / .22);
  background-image:linear-gradient(hsl(var(--h) 25% 40% / .14) 1px,transparent 1px),linear-gradient(90deg,hsl(var(--h) 25% 40% / .14) 1px,transparent 1px);background-size:28px 28px}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.6%,hsl(var(--h) 25% 40% / .2) 50%,transparent 50.4%)}
.ph .cap{position:absolute;left:12px;bottom:10px;right:12px;font-size:13px;font-weight:600;z-index:1;color:var(--ink)}
.ph .tag{position:absolute;right:10px;top:9px;font-size:11px;z-index:1;color:var(--ink-2);background:var(--panel);padding:2px 7px;border-radius:5px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.ph.fit{background:#FFFFFF}.ph.fit::after{display:none}.ph.fit img{padding:3%}
.ph.soon{background:var(--deep);display:grid;place-items:center;container-type:inline-size}
.ph.soon::after{inset:10px;background:none;border:1px solid var(--band-rule)}
.ph.soon .soon-t{position:relative;z-index:1;font-weight:800;font-stretch:125%;font-size:clamp(12px,6.5cqi,30px);letter-spacing:.02em;color:var(--glow);white-space:nowrap;text-align:center;padding:0 12px}
.ph.soon .cap{color:var(--band-ink);opacity:.8;left:20px;bottom:18px}

/* sections */
section.s{padding-block:64px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-top:1.5px solid var(--ink);padding-top:14px;margin-bottom:26px}
.sh h2{font-weight:700;font-stretch:125%;font-size:clamp(24px,3.4vw,34px);margin:0;letter-spacing:-.01em}
.sh p{margin:0;color:var(--ink-2);font-size:15px;max-width:46ch;text-align:right}
@media (max-width:640px){.sh{flex-direction:column}.sh p{text-align:left}}

/* work grid */
.work{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:26px 22px}
.card{grid-column:span 4;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;align-self:start}
.card.big{grid-column:span 8}
.card.mid{grid-column:span 6}
.card .ph{aspect-ratio:4/3}
.work .card{grid-column:span var(--span,3)}
.ctype{display:block;font-size:12.5px;font-weight:600;color:var(--teal);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .ctype+h3{margin-top:2px}
.feature-row{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:18px;margin-bottom:28px;align-items:stretch}
.feature-row.solo{grid-template-columns:minmax(0,1fr)}
.feature-row .card,.stack .card{grid-column:auto}
.card.feat{align-self:stretch}
.card.feat .ph{flex:1;aspect-ratio:auto;min-height:300px}
.card.feat h3{font-size:22px}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:18px}
.stack .card .ph{aspect-ratio:16/8.4}
@media (max-width:900px){.feature-row{grid-template-columns:minmax(0,1fr)}.card.feat .ph{flex:none;aspect-ratio:16/10;min-height:0}.stack{grid-template-rows:none;grid-template-columns:repeat(2,minmax(0,1fr))}.stack .card .ph{aspect-ratio:4/3}.work .card{grid-column:span 6}}
@media (max-width:600px){.stack{grid-template-columns:minmax(0,1fr)}.work .card{grid-column:1/-1}}
.card h3{font-size:19px;font-weight:700;margin:12px 0 0;font-stretch:112%}
.card .meta{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.card .meta span+span{border-left:1px solid var(--rule);padding-left:10px}
.card:hover h3{color:var(--teal)}
@media (prefers-reduced-motion:no-preference){.card .ph{transition:transform .35s ease}.card:hover .ph{transform:translateY(-3px)}}


/* research teaser */
.research{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
.research+.research{margin-top:48px;padding-top:40px;border-top:1px solid var(--rule)}
.research.flip>.ph{order:2}
.rcourse{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--teal)}
.rq{margin:14px 0 0;padding-left:18px;color:var(--ink-2);font-size:15.5px}
.rq li{margin:6px 0}
@media (max-width:800px){.research.flip>.ph{order:0}}
.research .ph{aspect-ratio:5/4}
.research h3{font-weight:800;font-stretch:125%;font-size:clamp(28px,4vw,44px);line-height:1.02;margin:0 0 12px}
.cities{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.cities span{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--panel)}
@media (max-width:800px){.research{grid-template-columns:minmax(0,1fr)}}

/* media */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.mi{background:var(--panel);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--rule)}
.mi .ph{aspect-ratio:16/10}
.mi .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.mi .kind{font-size:12.5px;font-weight:600;color:var(--teal)}
.mi h3{font-size:17px;line-height:1.3;margin:0;font-weight:650}
.mi p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
.mi .src{margin-top:auto;padding-top:8px;font-size:13px;color:var(--ink-2)}
a.mi:hover h3{color:var(--teal)}
.status-pill{display:inline-block;font-size:12px;font-weight:700;color:var(--on-teal);background:var(--teal);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:3px;font-stretch:100%}

function frame(img,hue,cap,cls=''){
  const src=img&&(img._local||img.src)?(img._local||img.src):null;
  // "Coming soon" card: shown for an image marked soon until a real photo is added (any JPG/PNG/WebP replaces it).
  if(!src&&img&&img.soon)return `<div class="ph soon ${cls}"><span class="soon-t">Coming soon</span>${cap?`<span class="cap">${esc(cap)}</span>`:''}</div>`;
  const fit=img&&img.fit==='contain'?'contain':'cover',pos=img&&img.pos||'50% 50%';
  return `<div class="ph ${cls} ${src&&fit==='contain'?'fit':''}" style="--h:${hue}">${src?`<img src="${src}" alt="${esc(cap||'')}" style="object-fit:${fit};object-position:${esc(pos)}">`:`<span class="tag">Photo</span>${cap?`<span class="cap">${esc(cap)}</span>`:''}`}</div>`;
}

// Selected work: one featured project with two stacked beside it, then even rows of four.
function workGrid(ps){
  if(!ps.length)return '<p class="muted">No projects yet.</p>';
  const fi=Math.max(0,ps.findIndex(x=>x.featured)),feat=ps[fi],rest=ps.filter((_,i)=>i!==fi);
  const stack=rest.slice(0,2),grid=rest.slice(2),n=grid.length,full=Math.floor(n/4)*4,rem=n-full;
  const card=(x,cls,span)=>`<button class="card ${cls}" data-project="${esc(x.id)}" data-flip="${ps.indexOf(x)}" ${span?`style="--span:${span}"`:''}>${frame(x.images[0],x.hue,x.images[0]?.caption)}
    <span class="ctype">${esc(x.type)}</span><h3>${esc(x.title)}${x.status?`<span class="status-pill">${esc(x.status)}</span>`:''}</h3><span class="meta"><span>${esc(x.location)}</span><span>${esc(x.date)}</span></span></button>`;
  return `<div class="feature-row ${stack.length?'':'solo'}">${card(feat,'feat')}${stack.length?`<div class="stack">${stack.map(x=>card(x,'st')).join('')}</div>`:''}</div>
    ${n?`<div class="work">${grid.map((x,i)=>card(x,'',i<full?3:(rem===1?6:12/rem))).join('')}</div>`:''}`;
}

    <div class="tstage">
      <div class="thead"><small>${esc(SITE.theater.label)}</small><h2>${esc(v.title)}</h2>${v.sub||v.src?`<p>${esc([v.sub,v.src].filter(Boolean).join(', '))}</p>`:''}</div>

async function gh(path,opt={},key=KEY()){
  const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+key,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});

  if(!r.ok){const e=new Error('GitHub said '+r.status);e.status=r.status;throw e}

}

function pendingPhotos(){const out=[];const walk=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(walk);return}
  if(typeof o.src==='string'&&o.src.startsWith('data:image/'))out.push(o);for(const k in o)if(!k.startsWith('_'))walk(o[k])};walk(SITE);return out}
async function publishToGitHub(){
  const photos=pendingPhotos(),stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
  const ref=await gh(RP()+'/git/ref/heads/'+GH.branch),base=await gh(RP()+'/git/commits/'+ref.object.sha);
  const entries=[],swaps=[];
  for(let n=0;n<photos.length;n++){const im=photos[n],path=`photos/up-${stamp}-${n+1}.jpg`;
    const blob=await gh(RP()+'/git/blobs',{method:'POST',body:JSON.stringify({content:im.src.split(',')[1],encoding:'base64'})});
    entries.push({path,mode:'100644',type:'blob',sha:blob.sha});swaps.push([im,path])}
  const data=JSON.parse(snap());const swapIn=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(swapIn);return}
    if(typeof o.src==='string'&&o.src.startsWith('data:image/')){const k=photos.findIndex(p=>p.src===o.src);if(k>=0)o.src=swaps[k][1]}for(const x in o)swapIn(o[x])};swapIn(data);
  entries.push({path:'content.json',mode:'100644',type:'blob',content:JSON.stringify(data,null,1)});
  const tree=await gh(RP()+'/git/trees',{method:'POST',body:JSON.stringify({base_tree:base.tree.sha,tree:entries})});
  const msg='Site edit '+new Date().toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+(photos.length?` (${photos.length} new photo${photos.length>1?'s':''})`:'');
  const commit=await gh(RP()+'/git/commits',{method:'POST',body:JSON.stringify({message:msg,tree:tree.sha,parents:[ref.object.sha]})});
  await gh(RP()+'/git/refs/heads/'+GH.branch,{method:'PATCH',body:JSON.stringify({sha:commit.sha})});
  swaps.forEach(([im,path])=>{im._local=im.src;im.src=path});SAFE.hist=null;
}

function setPath(path,val){const ks=path.split('.');let o=SITE;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],SITE)}
function markDirty(){dirty=true;const st=$('#st');if(st)st.textContent='You have unpublished changes.';const b=$('#publish');if(b)b.disabled=false}
function readImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  applyLook();
  const app=$('#app');

  hiStart();
}

  if(b.dataset.sec){const id=b.dataset.sec;go('section',id);if(id==='media'||id==='contact'){const el=document.getElementById(id);if(el)el.scrollIntoView()}return}

  if(b.dataset.addx!==undefined){const g=SITE.explore.groups[+b.dataset.addx];g.items.forEach(x=>x._open=false);g.items.unshift({title:'',kind:'',year:String(new Date().getFullYear()),text:'',link:'',image:null,hue:Math.floor(Math.random()*360),_open:true});markDirty();render();return}
  if(b.dataset.xdel){const [gi,ii]=b.dataset.xdel.split('.').map(Number);SITE.explore.groups[gi].items.splice(ii,1);markDirty();render();return}
  if(b.dataset.xmove){e.preventDefault();const [gi,ii]=b.dataset.xmove.split('.').map(Number),j=ii+ +b.dataset.d,it=SITE.explore.groups[gi].items;if(j<0||j>=it.length)return;[it[ii],it[j]]=[it[j],it[ii]];markDirty();render();return}
  if(b.dataset.go){go(b.dataset.go,null,b.dataset.to);return}
  if(b.dataset.jump){if(view!=='home'&&view!=='section')go('home',null,b.dataset.jump);else if(view==='section'){const el=document.getElementById(b.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth'});else go('home',null,b.dataset.jump)}else document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth'});return}
  if(b.dataset.theater){openTheater(b.dataset.theater);return}
  if(b.id==='tclose'){closeTheater();return}

  if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('Email copied')}catch{toast(b.dataset.copy)}return}

  if(b.dataset.imgdel!==undefined){SITE.projects[editProject].images.splice(+b.dataset.imgdel,1);markDirty();render();return}
  if(b.dataset.soon){const cur=getPath(b.dataset.soon);if(cur&&typeof cur==='object')cur.soon=!cur.soon;else setPath(b.dataset.soon,{soon:true});markDirty();render();return}
  if(b.dataset.clearimg){setPath(b.dataset.clearimg,null);markDirty();render();return}
  if(b.dataset.addmedia){SITE.media.forEach(m=>m._open=false);SITE.media.unshift({kind:b.dataset.addmedia,title:'',source:'',date:new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),url:'',text:'',image:null,hue:Math.floor(Math.random()*360),_open:true});markDirty();render();return}
  if(b.dataset.mmove!==undefined){e.preventDefault();const i=+b.dataset.mmove,j=i+ +b.dataset.d,ms=SITE.media;[ms[i],ms[j]]=[ms[j],ms[i]];markDirty();render();return}
  if(b.dataset.mdel!==undefined){SITE.media.splice(+b.dataset.mdel,1);markDirty();render();return}
  if(b.id==='addFact'){SITE.about.facts.push(['','']);markDirty();render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.path){setPath(t.dataset.path,t.value);const m=t.dataset.path.match(/^explore\.groups\.(\d+)\.items\.(\d+)\./);if(m)delete SITE.explore.groups[+m[1]].items[+m[2]].sample;markDirty()}
  if(t.dataset.lines){setPath(t.dataset.lines,t.value.split('\n').map(s=>s.trim()).filter(Boolean));markDirty()}
  if(t.dataset.cities){setPath(t.dataset.cities,t.value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(c=>c[0]).map(c=>[c[0],c[1]||'',c[2]||'']));markDirty()}
  if(t.id==='thOn'){SITE.theater.on=t.checked;markDirty()}
  if(t.id==='xOn'){SITE.explore.show=t.checked;markDirty()}
  if(t.id==='townSlide'){SITE.profile.townSlide=t.checked;markDirty()}
  if(t.id==='keyExp'){LS.set('aad.exp',t.value||null)}
  if(t.id==='soonProj'){SITE.projects[editProject].images.forEach(im=>{if(!im.src)im.soon=t.checked});markDirty();render()}
  if(t.dataset.path==='theater.url'){const ok=!!ytId(t.value),m=document.getElementById('thLinkMsg'),b=document.getElementById('thPrev');if(m){m.textContent=ok?'Link works.':(t.value?'That doesn\'t look like a YouTube link yet. Copy it from the Share button on YouTube.':'Paste a link to show the marquee.');m.style.color=ok?'':'#B3261E'}if(b)b.disabled=!ok}
  if(t.dataset.lookc){SITE.look[t.dataset.lookc]=t.value;applyLook();markDirty()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.path&&t.tagName==='SELECT'){setPath(t.dataset.path,t.value);markDirty();if(/\.(fit|pos)$/.test(t.dataset.path))render()}
  if(t.id==='thFill'&&t.value){const v=videos().find(x=>x.key===t.value);if(v){Object.assign(SITE.theater,{url:v.url,title:v.title,sub:v.sub,hue:v.hue});markDirty();render();toast('Filled in from '+v.title)}}
  if(t.dataset.imgpath&&t.files[0]){try{const src=await readImage(t.files[0]);const cur=getPath(t.dataset.imgpath);if(cur&&typeof cur==='object'&&'caption' in cur)cur.src=src;else setPath(t.dataset.imgpath,{src});markDirty();render();toast('Photo added and resized for the web')}catch{toast('That file could not be read as a photo.')}}
  if(t.id==='keyExp'){render()}
  if(t.id==='keyIn'&&t.value){const k=t.value.trim();t.value='';checkKey(k).then(()=>{LS.set('aad.key',k);toast('New key saved on this device.');render()}).catch(e=>toast('That key did not work: '+e.message))}
  if(t.id==='upBackup'&&t.files[0]){try{loadSite(await t.files[0].text());applyLook();markDirty();render();toast('Backup loaded. Publish to make it live.')}catch{toast('That file is not a portfolio backup.')}}
  if(t.id==='addImgs'&&t.files.length){const ims=SITE.projects[editProject].images;for(const f of t.files){try{ims.push({caption:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),src:await readImage(f),feature:false})}catch{}}markDirty();render();toast(`Added ${t.files.length} image${t.files.length===1?'':'s'}`)}
});
// Project cards flip through their images on hover.
let flipT=null;
document.addEventListener('pointerover',e=>{
  const c=e.target.closest&&e.target.closest('.card[data-flip]');if(!c||c.dataset.flipping)return;
  const x=live()[+c.dataset.flip];if(!x||x.images.length<2||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  c.dataset.flipping='1';let k=0;const ph=$('.ph',c);
  const tick=()=>{k=(k+1)%x.images.length;ph.outerHTML=frame(x.images[k],x.hue,x.images[k].caption)};
  c._flip=setInterval(()=>{if(!c.isConnected){clearInterval(c._flip);return}tick();},900);
  c.addEventListener('pointerleave',()=>{clearInterval(c._flip);delete c.dataset.flipping;const p2=$('.ph',c);if(p2)p2.outerHTML=frame(x.images[0],x.hue,x.images[0].caption)},{once:true});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&theaterOpen){closeTheater();return}if(e.key==='Escape'){const m=$('#menuSheet');if(m&&!m.hidden){m.hidden=true;const b=$('#menuBtn');b.setAttribute('aria-expanded','false');b.textContent='Menu';b.focus()}}});
document.addEventListener('click',e=>{if(theaterOpen&&e.target===theaterOpen)closeTheater();const m=document.getElementById('moreList');if(m&&!m.hidden&&!e.target.closest('.more')){m.hidden=true;$('#moreBtn').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='keyGate')tryUnlock(e.target.value)});
/* ---------- iPhone view: the site at iPhone 16 size (393 x 852 points) ---------- */
let phoneEl=null;
function openPhone(){
  closePhone();
  const o=document.createElement('div');o.className='phonesim';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','iPhone view');
  o.innerHTML=`<div class="ps-bar"><span>iPhone view, 393 × 852</span><button class="btn sm" id="phoneClose">Close</button></div>
    <div class="ps-fit"><div class="device"><div class="ps-status" aria-hidden="true"><b>9:41</b><i class="island"></i><span>●●● ▮</span></div><div class="screen2"><iframe name="phone-sim" title="Your site on an iPhone"></iframe></div><i class="homebar" aria-hidden="true"></i></div></div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';phoneEl=o;
  const f=$('iframe',o);f.srcdoc=PAGE_SRC;
  // If this browser blocks the inner page, say so instead of showing a blank phone.
  setTimeout(()=>{let ok=false;try{ok=!!f.contentDocument.querySelector('#app .name')}catch{}if(!ok&&phoneEl===o)$('.screen2',o).insertAdjacentHTML('beforeend','<p class="ps-fail">The iPhone view could not load here. On your real site it works from the editor, or open the site on your phone.</p>')},2500);
  const fit=()=>{const sc=Math.min(1,(innerHeight-90)/876,(innerWidth-24)/417);$('.device',o).style.transform=`scale(${sc})`;$('.ps-fit',o).style.height=876*sc+'px'};
  fit();o._fit=fit;addEventListener('resize',fit);
  $('#phoneClose',o).focus();
}
function closePhone(){if(!phoneEl)return;removeEventListener('resize',phoneEl._fit);phoneEl.remove();phoneEl=null;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&phoneEl&&!theaterOpen)closePhone()});

// Inside the iPhone view, show the same content (including unpublished edits) as the main window.
window.__SITE=SITE;
async function tryUnlock(k){k=(k||'').trim()||KEY();if(!k){toast('Paste your GitHub key first.');return}
  const st=$('.lock .note');if(st)st.textContent='Checking your key…';
  try{await checkKey(k);LS.set('aad.key',k);await pullLatest();unlocked=true;editAt='safety'===editAt?'safety':'profile';render();toast('Unlocked. You are editing the latest saved version.')}
  catch(e){if(st)st.textContent=e.status===401?'That key is not valid or has expired. Make a new one on GitHub (steps in your kit).':e.status===404||e.status===403?'This key cannot reach '+GH.repo+'. Make sure it has that repository selected with Contents: Read and write.':'Could not check the key ('+e.message+'). Check your connection and try again.'}
}
async function boot(){
  if(IN_PHONE){try{const P=parent.__SITE;if(P)for(const k of Object.keys(P))SITE[k]=structuredClone(P[k])}catch{}document.documentElement.classList.add('in-phone')}
  else{try{const r=await fetch('content.json?v='+Date.now(),{cache:'no-store'});if(r.ok)loadSite(await r.json())}catch(e){/* opened as a file or offline: the built-in copy is shown */}}
  if(location.hash==='#edit'){view='edit';history.replaceState(null,'',location.pathname);if(KEY()&&!IN_PHONE){render();tryUnlock(KEY());return}}
  render();
}
window.addEventListener('hashchange',()=>{if(location.hash==='#edit'){view='edit';history.replaceState(null,'',location.pathname);render();if(KEY()&&!unlocked)tryUnlock(KEY())}});
boot();
</script>
